name: Build Retro-Go Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.2
          target: esp32s3
          command: |
            # FORCE DELETE CACHE
            rm -f launcher/sdkconfig retro-core/sdkconfig gwenesis/sdkconfig fmsx/sdkconfig prboom-go/sdkconfig
            rm -rf launcher/build retro-core/build gwenesis/build fmsx/build prboom-go/build build
            
            # FORCE CLEAN AND BUILD
            idf.py fullclean || true
            python rg_tool.py build-img --target=esp32s3-st7735

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-firmware
          path: "**/*.img"
