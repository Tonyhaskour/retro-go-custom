- name: Build Firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.2
          target: esp32s3
          command: |
            # Force delete all old builds and pre-existing sdkconfig files so sdkconfig.defaults is read
            rm -rf build sdkconfig */build
            find . -name "sdkconfig" -delete
            
            # Build the firmware
            python rg_tool.py build-img --target=esp32s3-st7735
